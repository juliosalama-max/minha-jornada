name: Build Vercel Upload Bundle

on:
  push:
    branches:
      - "tmp/v2-vercel-bundle"

permissions:
  contents: write

jobs:
  bundle:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Pack deployable source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const rootFiles = new Set([
            '.gitignore',
            '.prettierrc',
            'eslint.config.mjs',
            'package-lock.json',
            'package.json',
            'startup.sh',
            'tsconfig.json',
            'vite.config.ts',
          ]);
          const prefixes = ['src/', 'server/', 'public/', 'migrations/', 'scripts/'];
          const extra = new Set(['.grok/app-env.json']);
          const binaryExt = /\.(png|jpg|jpeg|webp|gif|ico|woff2?|ttf|otf|wasm|data|pdf)$/i;

          function walk(dir='.') {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = path.posix.join(dir === '.' ? '' : dir.replaceAll('\\','/'), entry.name);
              if (rel === '.git' || rel.startsWith('.git/')) continue;
              if (rel === '.deploy-bundle' || rel.startsWith('.deploy-bundle/')) continue;
              if (entry.isDirectory()) out.push(...walk(rel));
              else out.push(rel);
            }
            return out;
          }

          const selected = walk().filter(file =>
            rootFiles.has(file) ||
            extra.has(file) ||
            prefixes.some(prefix => file.startsWith(prefix))
          ).sort();

          const records = selected.map(file => {
            const buf = fs.readFileSync(file);
            if (binaryExt.test(file)) {
              return { file, data: buf.toString('base64'), encoding: 'base64' };
            }
            return { file, data: buf.toString('utf8'), encoding: 'utf-8' };
          });

          fs.rmSync('.deploy-bundle', { recursive: true, force: true });
          fs.mkdirSync('.deploy-bundle', { recursive: true });

          const maxBytes = 450000;
          const parts = [];
          let current = [];
          let currentBytes = 2;

          for (const rec of records) {
            const encoded = JSON.stringify(rec);
            const bytes = Buffer.byteLength(encoded) + (current.length ? 1 : 0);
            if (current.length && currentBytes + bytes > maxBytes) {
              parts.push(current);
              current = [];
              currentBytes = 2;
            }
            current.push(rec);
            currentBytes += bytes;
          }
          if (current.length) parts.push(current);

          parts.forEach((part, i) => {
            const name = `part-${String(i + 1).padStart(2, '0')}.json`;
            fs.writeFileSync(path.join('.deploy-bundle', name), JSON.stringify(part));
          });

          fs.writeFileSync(
            '.deploy-bundle/manifest.json',
            JSON.stringify({
              sourceCommit: process.env.GITHUB_SHA,
              fileCount: records.length,
              parts: parts.length,
              files: parts.map((_, i) => `part-${String(i + 1).padStart(2, '0')}.json`),
            }, null, 2)
          );

          console.log(`Packed ${records.length} files into ${parts.length} parts`);
          NODE

      - name: Commit bundle to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-bundle
          git commit -m "chore: generate Vercel upload bundle [bundle-generated]"
          git push origin HEAD:${{ github.ref_name }}
